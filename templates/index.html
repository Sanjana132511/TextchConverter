{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>S.TextUtils.com</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Popper JS -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
</head>
<body>

<!-- ✅ Navbar with Bootstrap classes -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">S.TextUtils.com</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About-Us</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Dropdown</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">About-us</a></li>
            <li><a class="dropdown-item" href="#">Contact-us</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Something else here</a></li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link" href="#">Contact-Us</a></li>
      </ul>
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search"/>
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>

<!-- ✅ Alert box -->
<div class="alert alert-success alert-dismissible fade show" role="alert">
  <strong>Welcome to TextUtils</strong> You can do anything with your text here.
  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<!-- ✅ Form container -->
<div class="container">
  <form method="post" action="/analyze">{% csrf_token %}

    <div class="mb-3">
      <label for="exampleFormControlTextarea1" class="form-label">Enter text here do magic</label>
      <textarea class="form-control" id="exampleFormControlTextarea1" rows="10" name="text"></textarea>
    </div>

    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="checkNativeSwitch1" name="removefunc">
      <label class="form-check-label" for="checkNativeSwitch1">REMOVE PUNCTUATION</label>
    </div>

    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="checkNativeSwitch2" name="uppercse">
      <label class="form-check-label" for="checkNativeSwitch2">UPPERCASE</label>
    </div>

    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="checkNativeSwitch3" name="newline">
      <label class="form-check-label" for="checkNativeSwitch3">REMOVE NEWLINE</label>
    </div>

    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="checkNativeSwitch4" name="extraspe">
      <label class="form-check-label" for="checkNativeSwitch4">REMOVE EXTRA SPACES</label>
    </div>



    <button type="submit" class="btn btn-dark mt-2">ANALYZE TEXT</button>

  </form>
</div>

</body>
</html>
